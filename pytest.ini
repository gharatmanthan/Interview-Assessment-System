[pytest]
# Do not recurse into build artifacts / dependency trees. The portable
# backend bundle (release/) vendors site-packages which includes third-party
# test modules that must never be collected by the repo's own suite.
norecursedirs =
    release
    node_modules
    venv
    .venv
    .git
    .pytest_cache
    frontend
    electron
    dist
    *.egg-info
