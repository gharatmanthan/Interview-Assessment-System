services:
  - type: web
    name: interviewiq-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: INTERVIEWER_ID
        sync: false
      - key: INTERVIEWER_PASSWORD
        sync: false
      - key: INTERVIEWER_NAME
        sync: false
