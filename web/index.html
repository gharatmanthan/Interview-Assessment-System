<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InterviewIQ Candidate Access</title>
  <style>
    body { margin: 0; font: 16px system-ui, sans-serif; background: #f4f7fb; color: #172033; }
    main { max-width: 560px; margin: 8vh auto; padding: 32px; background: white; border-radius: 16px; box-shadow: 0 12px 40px #17203318; }
    h1 { margin-top: 0; } label { display: block; margin-top: 16px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { margin-top: 22px; padding: 12px 18px; border: 0; border-radius: 8px; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
    #message { margin-top: 18px; } .muted { color: #64748b; }
  </style>
</head>
<body>
<main>
  <h1>InterviewIQ</h1>
  <p id="job" class="muted">Open your invitation link to register for an interview.</p>
  <form id="registration" hidden>
    <label>Full name<input name="full_name" required maxlength="200"></label>
    <label>Email<input name="email" type="email" required maxlength="320"></label>
    <label>Password<input name="password" type="password" required minlength="8"></label>
    <button>Register and continue</button>
  </form>
  <p id="message"></p>
</main>
<script>
const token = new URLSearchParams(location.search).get("token");
const message = document.querySelector("#message");
const form = document.querySelector("#registration");
const api = "/api/v1/public/invitations/";
async function load() {
  if (!token) { message.textContent = "This page requires an invitation token."; return; }
  const response = await fetch(api + encodeURIComponent(token));
  if (!response.ok) { message.textContent = "This invitation is invalid or expired."; return; }
  const invitation = await response.json();
  document.querySelector("#job").textContent = `Interview for ${invitation.title}`;
  form.hidden = false;
}
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const data = Object.fromEntries(new FormData(form));
  const response = await fetch(api + encodeURIComponent(token) + "/register", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(data)
  });
  const result = await response.json();
  if (!response.ok) { message.textContent = result.detail || "Registration failed."; return; }
  localStorage.setItem("interviewiq_access_token", result.access_token);
  message.textContent = "Registration complete. Candidate interview access is ready.";
  form.hidden = true;
});
load().catch(() => { message.textContent = "Unable to reach the InterviewIQ service."; });
</script>
</body>
</html>
